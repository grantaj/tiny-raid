name: One-shot remove Raid speedo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Remove Raid speedo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove speed HUD
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''    const speedNorm=clamp((speed-MIN_SPEED)/(MAX_SPEED-MIN_SPEED),0,1);\n    ctx.fillText('SPD',15,65);\n    ctx.strokeStyle='#fff';ctx.strokeRect(49,56,94,9);\n    ctx.fillStyle='#59c6dd';ctx.fillRect(51,58,90*speedNorm,5);\n    ctx.fillStyle='#fff';ctx.fillText(String(Math.round(speed)),151,65);\n\n'''
          if old not in s:
              raise SystemExit('speed HUD block not found')
          s = s.replace(old, '')
          p.write_text(s)
          PY
          rm .github/workflows/one-shot-remove-speedo.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove Raid speed HUD'
          git push
