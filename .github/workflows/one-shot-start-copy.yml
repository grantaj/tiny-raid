name: One-shot start copy cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Apply start-screen copy cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tighten start screen
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('HOLD TO ARM', 'HOLD TO START')
          old = '''      ctx.font='15px monospace';ctx.fillText('HOLD = BANK RIGHT  •  RELEASE = BANK LEFT',W/2,H*.34+37);\n      ctx.fillStyle='#b9d9ef';ctx.fillText('clean flying builds speed • hard turns scrub it',W/2,H*.34+63);\n      drawStartBar(H*.34+91);'''
          new = '''      ctx.font='15px monospace';ctx.fillText('HOLD = BANK RIGHT  •  RELEASE = BANK LEFT',W/2,H*.34+37);\n      drawStartBar(H*.34+64);'''
          if old not in s:
              raise SystemExit('expected start-screen block not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY
          rm .github/workflows/one-shot-start-copy.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Tighten start screen copy'
          git push
