name: One-shot Raid start cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Remove Raid start explanation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove remaining start explanation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = """      ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 27px monospace';ctx.fillText('TINY RAID',W/2,H*.34);\n      ctx.font='15px monospace';ctx.fillText('HOLD = BANK RIGHT  •  RELEASE = BANK LEFT',W/2,H*.34+37);\n      drawStartBar(H*.34+64);"""
          new = """      ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 27px monospace';ctx.fillText('TINY RAID',W/2,H*.34);\n      drawStartBar(H*.34+45);"""
          if old not in s:
              raise SystemExit('expected Raid start block not found')
          p.write_text(s.replace(old, new))
          PY
          rm .github/workflows/one-shot-raid-start-clean.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove remaining Raid start explanation'
          git push
