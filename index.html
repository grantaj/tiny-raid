<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tiny Raid</title>
<style>
  html,body{margin:0;height:100%;background:#07131d;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#fff}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  const canvas=document.getElementById('game');
  const ctx=canvas.getContext('2d');
  let W=0,H=0,DPR=1;
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const lerp=(a,b,t)=>a+(b-a)*t;
  const rand=(a,b)=>a+Math.random()*(b-a);

  let hold=false,started=false,gameOver=false;
  let startCharging=false,startCharge=0;
  let score=0,best=+(localStorage.tinyRaidBest||0),fuel=100;
  let speed=235,t=0,distance=0,shake=0;
  let sections=[],enemies=[],bullets=[],enemyBullets=[],particles=[];
  let nextShot=0,sectionCount=0,nextJet=0,fuelSections=0;
  let refuelling=false;
  const plane={x:0,y:0,vx:0,bank:0,bankRate:0,w:28,h:34};
  const STEP=78;
  const BRIDGE_GAP=82;
  const BRIDGE_HP=3;
  const START_HOLD=.75;
  const MIN_SPEED=125;
  const MAX_SPEED=420;
  const FUEL_RATE=78;

  function resize(){
    DPR=Math.min(2,devicePixelRatio||1);
    W=innerWidth;H=innerHeight;
    canvas.width=W*DPR;canvas.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    if(sections.length) rebuildRiver();
  }
  addEventListener('resize',resize);

  function riverLimits(){
    return {minWidth:clamp(W*.33,165,270),maxWidth:clamp(W*.66,250,510)};
  }

  function reset(){
    hold=false;started=false;gameOver=false;startCharging=false;startCharge=0;
    score=0;fuel=100;speed=235;t=0;distance=0;shake=0;refuelling=false;
    enemies=[];bullets=[];enemyBullets=[];particles=[];
    nextShot=.1;sectionCount=0;nextJet=rand(4.5,8.0);
    fuelSections=Math.floor(rand(16,22));
    plane.x=W*.5;plane.y=H*.76;plane.vx=0;plane.bank=0;plane.bankRate=0;
    rebuildRiver();
  }

  function rebuildRiver(){
    const {minWidth,maxWidth}=riverLimits();
    const safeWidth=clamp(W*.62,minWidth,maxWidth);
    sections=[];
    let center=W*.5,width=clamp(W*.50,minWidth,maxWidth);
    for(let y=-STEP*3;y<H+STEP*3;y+=STEP){
      const randomCenter=clamp(center+rand(-29,29),width*.52,W-width*.52);
      const randomWidth=clamp(width+rand(-20,20),minWidth,maxWidth);
      const safe=clamp(1-Math.abs(y-plane.y)/(STEP*4.2),0,1);
      center=lerp(randomCenter,W*.5,safe*.94);
      width=lerp(randomWidth,safeWidth,safe);
      sections.push({y,center,width});
    }
    if(plane.x===0) plane.x=W*.5;
  }

  function riverAt(y){
    if(!sections.length) return {left:0,right:W,center:W*.5,width:W};
    for(let i=0;i<sections.length-1;i++){
      const a=sections[i],b=sections[i+1];
      if(y>=a.y&&y<=b.y){
        const q=(y-a.y)/(b.y-a.y);
        const center=lerp(a.center,b.center,q),width=lerp(a.width,b.width,q);
        return {left:center-width/2,right:center+width/2,center,width};
      }
    }
    const s=y<sections[0].y?sections[0]:sections[sections.length-1];
    return {left:s.center-s.width/2,right:s.center+s.width/2,center:s.center,width:s.width};
  }

  function makeSection(){
    const top=sections[0],{minWidth,maxWidth}=riverLimits();
    let width=clamp(top.width+rand(-24,24),minWidth,maxWidth);
    let center=clamp(top.center+rand(-35,35),width*.52,W-width*.52);
    if(Math.random()<.08) width=clamp(width-rand(20,48),minWidth,maxWidth);
    const s={y:top.y-STEP,center,width};
    sections.unshift(s);sectionCount++;spawnForSection(s);
  }

  function spawnForSection(s){
    if(sectionCount<5) return;

    if(sectionCount%14===0){
      enemies.push({kind:'bridge',x:s.center,y:s.y,w:s.width,h:13,gap:Math.min(BRIDGE_GAP,s.width*.55),hp:BRIDGE_HP,dead:false});
      return;
    }

    // Fuel is scheduled by distance, rather than appearing as a generous random
    // pickup. Each depot is an event the player should plan for.
    fuelSections--;
    if(fuelSections<=0){
      enemies.push({kind:'fuel',x:rand(s.center-s.width*.24,s.center+s.width*.24),y:s.y,w:34,h:72});
      fuelSections=Math.floor(rand(18,27));
      return;
    }

    const r=Math.random();
    if(r<.20){
      const margin=26;
      enemies.push({kind:'boat',x:rand(s.center-s.width/2+margin,s.center+s.width/2-margin),y:s.y,w:22,h:34,phase:rand(0,6.28)});
    }else if(r<.28){
      const side=Math.random()<.5?-1:1;
      enemies.push({kind:'gun',x:s.center+side*(s.width/2+17),y:s.y,w:20,h:20,cool:rand(.5,1.6)});
    }
  }

  function explode(x,y,n=18){
    for(let i=0;i<n;i++){
      const a=rand(0,Math.PI*2),s=rand(30,190);
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.25,.8)});
    }
    shake=Math.max(shake,5);
  }

  function crash(){
    if(gameOver)return;
    gameOver=true;hold=false;startCharging=false;startCharge=0;refuelling=false;
    explode(plane.x,plane.y,34);
    best=Math.max(best,Math.floor(score));localStorage.tinyRaidBest=best;
  }

  function launch(){
    if(gameOver) reset();
    started=true;gameOver=false;hold=false;startCharging=false;startCharge=0;
  }

  function press(){
    if(!started||gameOver){
      startCharging=true;startCharge=0;hold=false;return;
    }
    hold=true;
  }
  function release(){
    if(!started||gameOver){
      if(startCharging&&startCharge>=1) launch();
      startCharging=false;startCharge=0;hold=false;return;
    }
    hold=false;
  }

  addEventListener('keydown',e=>{
    if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)press();}
  });
  addEventListener('keyup',e=>{
    if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();release();}
  });
  canvas.addEventListener('pointerdown',e=>{e.preventDefault();press();});
  addEventListener('pointerup',release);
  addEventListener('pointercancel',release);
  addEventListener('blur',()=>{
    if(!started||gameOver){startCharging=false;startCharge=0;}
    else hold=false;
  });

  function hit(ax,ay,aw,ah,bx,by,bw,bh){
    return Math.abs(ax-bx)*2<aw+bw&&Math.abs(ay-by)*2<ah+bh;
  }

  function bridgeSlabs(e){
    const gap=e.gap??BRIDGE_GAP;
    const slabW=Math.max(0,(e.w-gap)/2);
    return {gap,slabW,leftX:e.x-gap/2-slabW/2,rightX:e.x+gap/2+slabW/2};
  }

  function bridgeHitsPlane(e){
    const planeHalfW=plane.w*.50;
    const planeHalfH=plane.h*.40;
    const overlapsY=Math.abs(plane.y-e.y)<planeHalfH+e.h/2;
    if(!overlapsY)return false;
    if(!e.dead)return true;
    const gapHalf=(e.gap??BRIDGE_GAP)/2;
    const gapLeft=e.x-gapHalf,gapRight=e.x+gapHalf;
    const planeLeft=plane.x-planeHalfW,planeRight=plane.x+planeHalfW;
    return planeLeft<=gapLeft||planeRight>=gapRight;
  }

  function update(dt){
    dt=Math.min(dt,.033);
    particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.45,dt);p.vy*=Math.pow(.45,dt);p.life-=dt;});
    particles=particles.filter(p=>p.life>0);
    shake*=Math.pow(.025,dt);

    if(!started||gameOver){
      if(startCharging) startCharge=clamp(startCharge+dt/START_HOLD,0,1);
      return;
    }
    t+=dt;

    const target=hold?1:-1;
    const oldBank=plane.bank;
    plane.bank+=(target-plane.bank)*(1-Math.exp(-11*dt));
    plane.bank=clamp(plane.bank,-1,1);
    plane.bankRate=(plane.bank-oldBank)/Math.max(dt,.001);

    const targetVx=plane.bank*205;
    plane.vx+=(targetVx-plane.vx)*(1-Math.exp(-7.5*dt));
    plane.vx=clamp(plane.vx,-215,215);
    plane.x+=plane.vx*dt;

    const rollPenalty=clamp(Math.abs(plane.bankRate)/15,0,1);
    const turnLoad=clamp(Math.abs(plane.bank)*.80+Math.abs(plane.vx)/215*.10+rollPenalty*.12,0,1);
    const cleanFlight=1-turnLoad;
    const targetSpeed=lerp(MIN_SPEED,MAX_SPEED,Math.pow(cleanFlight,1.35));
    const response=targetSpeed<speed?4.2:1.35;
    speed+=(targetSpeed-speed)*(1-Math.exp(-response*dt));
    distance+=speed*dt;score+=speed*dt*.045;

    // A full tank now lasts only around 23-28 seconds. Fuel use is mostly time-based,
    // so you cannot solve the resource problem simply by crawling everywhere.
    fuel-=dt*(3.2+speed/350);
    if(fuel<=0){fuel=0;crash();return;}

    const dy=speed*dt;
    sections.forEach(s=>s.y+=dy);
    enemies.forEach(e=>{if(e.kind!=='jet')e.y+=dy;});
    enemyBullets.forEach(b=>b.y+=dy+b.vy*dt);
    bullets.forEach(b=>b.y+=dy-b.vy*dt);

    while(sections[0].y>-STEP*2)makeSection();
    while(sections.length>2&&sections[sections.length-1].y>H+STEP*3)sections.pop();

    const r=riverAt(plane.y),half=plane.w*.42;
    if(plane.x-half<r.left||plane.x+half>r.right){crash();return;}

    nextShot-=dt;
    if(nextShot<=0){bullets.push({x:plane.x,y:plane.y-plane.h*.55,vy:520});nextShot=.14;}

    nextJet-=dt;
    if(nextJet<=0){
      enemies.push({kind:'jet',x:W+48,y:rand(H*.18,H*.58),w:40,h:14,vx:-rand(285,360)});
      nextJet=rand(6.5,11.5);
    }

    for(const e of enemies){
      if(e.kind==='gun'||e.kind==='boat'){
        e.cool=(e.cool??rand(.6,1.6))-dt;
        if(e.y>-60&&e.y<plane.y-100&&e.cool<=0){
          const dx=plane.x-e.x,dy2=plane.y-e.y,len=Math.hypot(dx,dy2)||1;
          enemyBullets.push({x:e.x,y:e.y,vx:dx/len*52,vy:88});
          e.cool=rand(1.25,2.05);
        }
      }
      if(e.kind==='boat')e.x+=Math.sin(t*1.5+e.phase)*8*dt;
      if(e.kind==='jet')e.x+=e.vx*dt;
    }
    enemyBullets.forEach(b=>b.x+=b.vx*dt);

    for(let bi=bullets.length-1;bi>=0;bi--){
      const b=bullets[bi];let used=false;
      for(let ei=enemies.length-1;ei>=0;ei--){
        const e=enemies[ei];
        if(e.kind==='fuel')continue;
        if(e.kind==='bridge'){
          const gap=e.gap??BRIDGE_GAP;
          const visible=e.y-e.h/2>=0 && e.y+e.h/2<=H;
          if(visible&&!e.dead&&Math.abs(b.y-e.y)<9&&Math.abs(b.x-e.x)<gap/2){
            bullets.splice(bi,1);used=true;e.hp--;
            if(e.hp<=0){e.dead=true;score+=140;explode(e.x,e.y,24);}
            break;
          }
        }else if(hit(b.x,b.y,4,9,e.x,e.y,e.w,e.h)){
          bullets.splice(bi,1);used=true;explode(e.x,e.y,e.kind==='jet'?24:14);
          score+=e.kind==='jet'?220:(e.kind==='gun'?55:45);enemies.splice(ei,1);break;
        }
      }
      if(used)continue;
    }

    // Refuelling is continuous, not an instant pickup. A slow, well-aligned pass
    // can restore a large amount; blasting through at high speed gets much less.
    refuelling=false;
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      if(e.kind==='fuel'){
        if(hit(plane.x,plane.y,plane.w*.62,plane.h*.72,e.x,e.y,e.w,e.h)){
          refuelling=true;
          fuel=clamp(fuel+FUEL_RATE*dt,0,100);
        }
      }else if(e.kind==='bridge'){
        if(bridgeHitsPlane(e)){crash();return;}
      }else if(hit(plane.x,plane.y,plane.w*.72,plane.h*.72,e.x,e.y,e.w,e.h)){
        crash();return;
      }
    }

    for(const b of enemyBullets){
      if(hit(plane.x,plane.y,plane.w*.54,plane.h*.54,b.x,b.y,5,7)){crash();return;}
    }

    bullets=bullets.filter(b=>b.y>-40&&b.y<H+40);
    enemyBullets=enemyBullets.filter(b=>b.y>-50&&b.y<H+60&&b.x>-40&&b.x<W+40);
    enemies=enemies.filter(e=>e.kind==='jet'?e.x>-70:e.y<H+90);
  }

  function drawRiver(){
    ctx.fillStyle='#31451d';ctx.fillRect(0,0,W,H);
    ctx.beginPath();
    for(let i=0;i<sections.length;i++){
      const s=sections[i],x=s.center-s.width/2;
      if(i===0)ctx.moveTo(x,s.y);else ctx.lineTo(x,s.y);
    }
    for(let i=sections.length-1;i>=0;i--){const s=sections[i];ctx.lineTo(s.center+s.width/2,s.y);}
    ctx.closePath();ctx.fillStyle='#123d63';ctx.fill();

    ctx.strokeStyle='#76a43c';ctx.lineWidth=4;
    for(const side of [-1,1]){
      ctx.beginPath();
      sections.forEach((s,i)=>{
        const x=s.center+side*s.width/2;
        if(i===0)ctx.moveTo(x,s.y);else ctx.lineTo(x,s.y);
      });
      ctx.stroke();
    }

    const speedNorm=clamp((speed-MIN_SPEED)/(MAX_SPEED-MIN_SPEED),0,1);
    const streakCount=26;
    const streakLength=16+speedNorm*42;
    ctx.strokeStyle=`rgba(150,205,235,${.16+speedNorm*.18})`;
    ctx.lineWidth=1;
    for(let i=0;i<streakCount;i++){
      const y=((i*71+distance*.90)%(H+120))-60;
      const r=riverAt(y),x=r.left+r.width*((i*37)%100)/100;
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+streakLength);ctx.stroke();
    }
  }

  function drawEnemy(e){
    if(e.kind==='fuel'){
      ctx.fillStyle='#f4d447';ctx.fillRect(e.x-e.w/2,e.y-e.h/2,e.w,e.h);
      ctx.fillStyle='#332d09';
      for(let y=e.y-e.h/2+8;y<e.y+e.h/2-5;y+=12)ctx.fillRect(e.x-e.w/2+5,y,e.w-10,3);
      ctx.fillStyle='#332d09';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText('FUEL',e.x,e.y+3);return;
    }
    if(e.kind==='bridge'){
      const g=bridgeSlabs(e);
      if(e.dead){
        ctx.fillStyle='#6f5739';
        ctx.fillRect(e.x-e.w/2,e.y-e.h/2,g.slabW,e.h);
        ctx.fillRect(e.x+g.gap/2,e.y-e.h/2,g.slabW,e.h);
        ctx.strokeStyle='#b99867';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(e.x-g.gap/2,e.y-e.h/2);ctx.lineTo(e.x-g.gap/2,e.y+e.h/2);ctx.stroke();
        ctx.beginPath();ctx.moveTo(e.x+g.gap/2,e.y-e.h/2);ctx.lineTo(e.x+g.gap/2,e.y+e.h/2);ctx.stroke();
      }else{
        ctx.fillStyle='#8b7654';ctx.fillRect(e.x-e.w/2,e.y-e.h/2,e.w,e.h);
        ctx.fillStyle='#e8b954';ctx.fillRect(e.x-g.gap/2,e.y-e.h/2,g.gap,e.h);
      }
      return;
    }
    if(e.kind==='jet'){
      ctx.fillStyle='#dcecf6';ctx.beginPath();
      ctx.moveTo(e.x-21,e.y);ctx.lineTo(e.x+16,e.y-5);ctx.lineTo(e.x+20,e.y);ctx.lineTo(e.x+16,e.y+5);ctx.closePath();ctx.fill();
      ctx.fillStyle='#77d5f2';ctx.fillRect(e.x-2,e.y-11,6,22);
      ctx.fillStyle='#ffb45e';ctx.fillRect(e.x+18,e.y-2,7,4);
      return;
    }
    if(e.kind==='boat'){
      ctx.fillStyle='#d9594c';ctx.beginPath();
      ctx.moveTo(e.x,e.y-e.h/2);ctx.lineTo(e.x+e.w/2,e.y+e.h*.28);ctx.lineTo(e.x,e.y+e.h/2);ctx.lineTo(e.x-e.w/2,e.y+e.h*.28);ctx.closePath();ctx.fill();
      ctx.fillStyle='#f0d7bd';ctx.fillRect(e.x-3,e.y-6,6,10);
    }else{
      ctx.fillStyle='#c96748';ctx.fillRect(e.x-9,e.y-9,18,18);
      ctx.strokeStyle='#f1aa70';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.x,e.y+15);ctx.stroke();
    }
  }

  function drawPlane(){
    ctx.save();ctx.translate(plane.x,plane.y);
    ctx.scale(1-Math.abs(plane.bank)*.42,1);
    ctx.fillStyle='#edf4e9';ctx.beginPath();
    ctx.moveTo(0,-18);ctx.lineTo(5,-4);ctx.lineTo(18,4);ctx.lineTo(5,7);ctx.lineTo(4,17);ctx.lineTo(-4,17);ctx.lineTo(-5,7);ctx.lineTo(-18,4);ctx.lineTo(-5,-4);ctx.closePath();ctx.fill();
    ctx.fillStyle='#59c6dd';ctx.fillRect(-3,-9,6,9);
    const speedNorm=clamp((speed-MIN_SPEED)/(MAX_SPEED-MIN_SPEED),0,1);
    ctx.fillStyle=refuelling?'#f4d447':'#f7a34b';ctx.fillRect(-2,17,4,5+speedNorm*12);
    ctx.restore();
  }

  function drawStartBar(y){
    const bw=Math.min(210,W*.46),bh=10,x=W/2-bw/2;
    ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(x,y,bw,bh);
    ctx.fillStyle=startCharge>=1?'#f4d447':'#b9d9ef';
    ctx.fillRect(x+2,y+2,(bw-4)*startCharge,bh-4);
    ctx.fillStyle='#fff';ctx.font='13px monospace';ctx.textAlign='center';
    ctx.fillText(startCharge>=1?'RELEASE':'HOLD TO ARM',W/2,y+29);
  }

  function draw(){
    ctx.save();
    ctx.translate(shake?rand(-shake,shake):0,shake?rand(-shake,shake):0);
    drawRiver();enemies.forEach(drawEnemy);
    ctx.fillStyle='#fff7b2';for(const b of bullets)ctx.fillRect(b.x-1,b.y-6,2,10);
    ctx.fillStyle='#ff8f72';for(const b of enemyBullets){ctx.beginPath();ctx.arc(b.x,b.y,2.5,0,Math.PI*2);ctx.fill();}
    if(!gameOver||Math.floor(performance.now()/90)%2===0)drawPlane();
    ctx.fillStyle='#ffd25a';for(const p of particles){ctx.globalAlpha=clamp(p.life*2,0,1);ctx.fillRect(p.x-2,p.y-2,4,4);}ctx.globalAlpha=1;

    ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='15px monospace';
    ctx.fillText(`SCORE ${String(Math.floor(score)).padStart(5,'0')}`,15,25);
    ctx.fillText(`BEST  ${String(best).padStart(5,'0')}`,15,45);
    const speedNorm=clamp((speed-MIN_SPEED)/(MAX_SPEED-MIN_SPEED),0,1);
    ctx.fillText('SPD',15,65);
    ctx.strokeStyle='#fff';ctx.strokeRect(49,56,94,9);
    ctx.fillStyle='#59c6dd';ctx.fillRect(51,58,90*speedNorm,5);
    ctx.fillStyle='#fff';ctx.fillText(String(Math.round(speed)),151,65);

    const fw=Math.min(140,W*.28),fx=W-fw-15;
    ctx.fillText(refuelling?'FUEL +':'FUEL',fx,25);ctx.strokeStyle='#fff';ctx.strokeRect(fx,34,fw,10);
    const low=fuel<25;
    ctx.fillStyle=low&&Math.floor(t*6)%2===0?'#fff':(low?'#ff665e':'#f0d64d');
    ctx.fillRect(fx+2,36,(fw-4)*fuel/100,6);

    if(!started&&!gameOver){
      ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 27px monospace';ctx.fillText('TINY RAID',W/2,H*.34);
      ctx.font='15px monospace';ctx.fillText('HOLD = BANK RIGHT  •  RELEASE = BANK LEFT',W/2,H*.34+37);
      ctx.fillStyle='#b9d9ef';ctx.fillText('clean flying builds speed • hard turns scrub it',W/2,H*.34+63);
      drawStartBar(H*.34+91);
    }
    if(gameOver){
      ctx.fillStyle='rgba(0,0,0,.48)';ctx.fillRect(0,0,W,H);
      ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 28px monospace';ctx.fillText('RAID OVER',W/2,H*.40);
      ctx.font='15px monospace';ctx.fillText(`score ${Math.floor(score)} · best ${best}`,W/2,H*.40+34);
      drawStartBar(H*.40+58);
    }
    ctx.restore();
  }

  let last=performance.now();
  function frame(now){const dt=(now-last)/1000;last=now;update(dt);draw();requestAnimationFrame(frame);}
  resize();reset();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
